version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Google Cloud / OAuth 系はまとめて上げないと相互のバージョン整合が崩れやすいため。
      google:
        patterns:
          - "cloud.google.com/go*"
          - "google.golang.org/*"
          - "golang.org/x/oauth2"
    commit-message:
      prefix: "deps"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
