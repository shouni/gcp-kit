version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gocritic
    - revive
    # This is a security-oriented library, so the following are enabled in addition.
    - gosec # the standard checks around crypto, permissions and injection
    - errorlint # catches missed errors.Is/As (== comparisons and %v wrapping)
    - bodyclose # unclosed HTTP response bodies
    - noctx # HTTP requests issued without a context
  settings:
    errcheck:
      exclude-functions:
        - (io.ReadCloser).Close

  exclusions:
    rules:
      # Tests build things deliberately to reproduce error paths, so these are relaxed there.
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofmt
    - goimports
